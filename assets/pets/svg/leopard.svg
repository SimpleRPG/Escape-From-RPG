  </g>

  <g id="front-leg-right">
   <path d="M107 74 Q108 94 111 110"
    fill="none" stroke="#b87d48" stroke-width="8"
    stroke-linecap="round"/>
  </g>

  <g id="neck">
   <path d="M65 55 Q67 35 80 28 Q95 31 100 53
            Q88 65 65 55Z"
    fill="#ad7440" stroke="#3e2d21" stroke-width="3"/>
  </g>

  <g id="head">
   <path d="M57 34 Q61 18 78 13 Q95 13 106 27
            Q109 42 99 53 Q81 56 66 47 Q58 42 57 34Z"
    fill="#b87d48" stroke="#3e2d21" stroke-width="3"/>
  </g>

  <g id="ear-left">
   <path d="M64 26 L51 7 L70 18 L75 31Z"
    fill="#a96f3f" stroke="#3e2d21" stroke-width="3"/>
  </g>

  <g id="ear-right">
   <path d="M94 24 L108 7 L105 29 L97 34Z"
    fill="#a96f3f" stroke="#3e2d21" stroke-width="3"/>
