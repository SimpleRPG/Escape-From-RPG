<svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 160 120"
 role="img"
 aria-label="leopard pet master artwork">
 <title>leopard</title>
 <g id="pet-root">

  <g id="tail">
   <path d="M119 76 Q151 66 151 37 Q149 25 142 27
            Q145 51 112 63"
    fill="none" stroke="#a96f3f" stroke-width="8"
    stroke-linecap="round"/>
  </g>

  <g id="hind-leg-left">
   <path d="M49 75 Q44 94 48 111"
    fill="none" stroke="#a96f3f" stroke-width="8"
    stroke-linecap="round"/>
  </g>

  <g id="hind-leg-right">
   <path d="M66 78 Q63 96 65 112"
    fill="none" stroke="#b87d48" stroke-width="8"
    stroke-linecap="round"/>
  </g>

  <g id="body">
   <path d="M25 66
            Q39 45 69 43
            Q105 42 130 59
            Q139 69 130 79
            Q109 91 76 89
            Q43 87 25 66Z"
    fill="#b57a43" stroke="#3e2d21" stroke-width="3"/>
  </g>

  <g id="chest">
   <path d="M82 47 Q101 48 115 59 Q111 73 101 82
