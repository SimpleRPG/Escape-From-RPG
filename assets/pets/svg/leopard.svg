  </g>

  <g id="eye">
   <circle cx="91" cy="29" r="3" fill="#17130f"/>
  </g>

  <g id="rosette-markings">
   <circle cx="48" cy="61" r="3.5" fill="none" stroke="#4d321f" stroke-width="2"/>
   <circle cx="62" cy="55" r="3.5" fill="none" stroke="#4d321f" stroke-width="2"/>
   <circle cx="75" cy="68" r="3.5" fill="none" stroke="#4d321f" stroke-width="2"/>
   <circle cx="92" cy="61" r="3.5" fill="none" stroke="#4d321f" stroke-width="2"/>
   <circle cx="108" cy="69" r="3.5" fill="none" stroke="#4d321f" stroke-width="2"/>
  </g>

 </g>
</svg>
