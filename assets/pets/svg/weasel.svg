  </g>

  <g id="ear-left">
   <ellipse cx="67" cy="21" rx="7" ry="6"
    fill="#84684f" stroke="#342a22" stroke-width="2"/>
  </g>

  <g id="ear-right">
   <ellipse cx="91" cy="20" rx="7" ry="6"
