  <g id="nose">
   <path d="M103 42 Q111 41 113 47 Q109 52 103 49Z"
    fill="#29211c"/>
  </g>

  <g id="eye">
   <circle cx="91" cy="29" r="3" fill="#171411"/>
  </g>

 </g>
</svg>
