  </g>

  <g id="rear-leg-left">
   <path d="M55 78 Q49 91 52 103 L60 104 L65 81"
    fill="#876c52" stroke="#342a22" stroke-width="3"/>
  </g>

  <g id="rear-leg-right">
   <path d="M72 80 Q67 93 70 106 L77 106 L80 81"
    fill="#997d61" stroke="#342a22" stroke-width="3"/>
  </g>

  <g id="body">
   <path d="M23 68
            Q35 51 60 48
            Q91 45 117 57
            Q128 65 124 76
            Q107 89 78 91
            Q44 89 23 68Z"
