<svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 160 120"
 role="img"
 aria-label="weasel pet master artwork">
 <title>weasel</title>
 <g id="pet-root">

  <g id="tail">
   <path d="M45 75 Q18 82 13 101 Q15 111 25 107
            Q27 94 51 90"
