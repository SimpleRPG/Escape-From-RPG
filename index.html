<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101216">
<title>Escape From RPG</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="efr_expansion.css">
<link rel="stylesheet" href="efr_pet.css">
</head>
<body>
<main id="app">
<header class="topbar">
  <div>
    <h1>ESCAPE FROM RPG</h1>
    <p id="status">拠点</p>
  </div>
  <!-- startBtn is provided by the base home -->
</header>

<section id="basePanel" class="panel efrBaseHome">
  <div class="efrBaseHero">
    <div>
      <div class="efrBaseEyebrow">SAFE HOUSE</div>
      <h2>拠点</h2>
      <p>探索の準備、装備、倉庫、クラフト、強化をここで管理します。</p>
    </div>
  </div>

  <div class="efrBaseStats">
    <div class="efrBaseStat">
      <span>倉庫</span>
      <strong id="baseLoot">0</strong>
      <small>保管アイテム</small>
    </div>

    <div class="efrBaseStat">
      <span>脱出回数</span>
      <strong id="escapes">0</strong>
      <small>成功した探索</small>
    </div>

    <div class="efrBaseStat">
      <span>武器1</span>
      <strong id="baseWeapon">素手</strong>
      <small>現在の装備</small>
    </div>
  </div>

  <div class="efrBaseSection">
    <div class="efrBaseSectionHead">
      <h3>出撃</h3>
      <span>次の探索へ</span>
    </div>

    <div class="efrBaseActionGrid">
      <button id="startBtn" class="efrBaseAction efrBaseActionPrimary">
        <strong>探索開始</strong>
        <span>出撃準備を確認して探索へ</span>
      </button>

      <button id="hubBtn" class="efrBaseAction">
        <strong>拠点管理</strong>
        <span>倉庫・クラフト・強化・施設</span>
      </button>
    </div>
  </div>

  <div class="efrBaseSection">
    <div class="efrBaseSectionHead">
      <h3>現在の装備</h3>
      <span>概要</span>
    </div>

    <div class="efrBaseEquipment">
      <div>
        <span>武器1</span>
        <strong id="baseWeapon2">素手</strong>
      </div>

      <div>
        <span>武器2</span>
        <strong id="baseWeaponSlot2">空き</strong>
      </div>

      <div>
        <span>頭</span>
        <strong id="baseHead">なし</strong>
      </div>

      <div>
        <span>胸</span>
        <strong id="baseChest">なし</strong>
      </div>

      <div>
        <span>足</span>
        <strong id="baseLegs">なし</strong>
      </div>

      <div>
        <span>バックパック</span>
        <strong id="baseBackpack">なし</strong>
      </div>
    </div>
  </div>

  <div class="efrBaseSection efrBaseGuide">
    <div>
      <strong>持ち物はここでは表示しません</strong>
      <span>倉庫の中身は「拠点管理 → 倉庫」、今回持っていく物は「探索開始 → 出撃準備」で確認できます。</span>
    </div>
  </div>
</section>

<section id="raidPanel" class="panel hidden">
  <div class="hud">
    <span>HP <strong id="hp">100</strong></span>
    <span>武器1 <strong id="weapon">素手</strong></span>
    <span>武器2 <strong id="weapon2">空き</strong></span>
    <span>防御 <strong id="armor">0</strong></span>
    <span>バッグ <strong id="bagCount">0/4</strong></span>
    <button id="inventoryBtn" class="inventoryButton">装備/バッグ</button>
    <span>敵 <strong id="enemyCount">0</strong></span>
    <span>建物 <strong id="buildingCount">0</strong></span>
  </div>

  <canvas id="game" width="960" height="540"></canvas>

  <div class="controls">
    <div id="stickArea" class="stickArea">
      <div id="stickBase" class="stickBase">
        <div id="stickKnob" class="stickKnob"></div>
      </div>
    </div>

    <button id="attackBtn" class="attack">攻撃</button>
  </div>

  <div id="interactionBar" class="interactionBar hidden">
    <span id="interactionText">調べる</span>
    <button id="interactBtn">調べる</button>
  </div>

  <section id="inventoryPanel" class="lootPanel hidden">
    <div class="lootHeader">
      <strong>装備・バッグ</strong>
      <button id="closeInventoryBtn">閉じる</button>
    </div>
    <div id="equipmentSlots" class="equipmentSlots"></div>
    <div id="inventoryContents" class="lootContents"></div>
  </section>

  <section id="lootPanel" class="lootPanel hidden">
    <div class="lootHeader">
      <strong id="lootTitle">中身</strong>
      <button id="closeLootBtn">閉じる</button>
    </div>
    <div id="lootContents" class="lootContents"></div>
  </section>

  <p id="mapInfo" class="hint"></p>
</section>

<section id="resultPanel" class="panel hidden">
  <h2 id="resultTitle"></h2>
  <p id="resultText"></p>
  <button id="returnBtn">拠点へ戻る</button>
</section>
</main>

<script src="game.js"></script>
<script src="efr_expansion.js"></script>
<script src="efr_loadout.js"></script>
<script src="efr_hub.js"></script>\n<script src="efr_magic.js"></script>
<script src="efr_pet.js"></script>
<script src="efr_base_integration.js"></script>
<script src="efr_base_unification.js"></script>
</body>
</html>
